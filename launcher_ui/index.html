<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chirag Putty Launcher</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-theme="Slate">
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <defs>
    <symbol id="i-port" viewBox="0 0 24 24"><path d="M3.5 5.5h17v10h-4.5v3h-8v-3H3.5z"/><path d="M8 9v2.5M10.7 9v2.5M13.3 9v2.5M16 9v2.5"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3.8l2.5 5.2 5.7.8-4.1 4 1 5.6-5.1-2.7-5.1 2.7 1-5.6-4.1-4 5.7-.8z"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3.5 7.5a2 2 0 012-2h4l2 2h7a2 2 0 012 2v7.5a2 2 0 01-2 2h-13a2 2 0 01-2-2z"/></symbol>
    <symbol id="i-log" viewBox="0 0 24 24"><path d="M6 3.5h8l4 4v13H6z"/><path d="M14 3.5v4h4M9 12h6M9 15.5h6"/></symbol>
    <symbol id="i-netbox" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="5" rx="1"/><rect x="4" y="10.5" width="16" height="5" rx="1"/><path d="M7 6.5h.01M7 13h.01M12 15.5V20M8 20h8"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M5 6h9M18 6h1M5 12h3M12 12h7M5 18h11M20 18h-1"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11" height="11" rx="2"/><path d="M15.5 8.5v-2a2 2 0 00-2-2h-7a2 2 0 00-2 2v7a2 2 0 002 2h2"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 7h15M10 4h4M6.5 7l1 12.5h9l1-12.5M10 10.5v6M14 10.5v6"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M15.5 4.5l4 4L9 19H5v-4z"/><path d="M13 7l4 4"/></symbol>
    <symbol id="i-pulse" viewBox="0 0 24 24"><path d="M3 12h4l2.5-6 5 12 2.5-6h4"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 16.5V11a6 6 0 0112 0v5.5l1.5 2h-15z"/><path d="M10 20.5a2.2 2.2 0 004 0"/></symbol>
    <symbol id="i-sync" viewBox="0 0 24 24"><path d="M19.5 12a7.5 7.5 0 01-13 5.1M4.5 12a7.5 7.5 0 0113-5.1"/><path d="M17.5 3.5v3.4h-3.4M6.5 20.5v-3.4h3.4"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15V4.5M7.5 9L12 4.5 16.5 9M4.5 15v3.5a1.5 1.5 0 001.5 1.5h12a1.5 1.5 0 001.5-1.5V15"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4.5V15M7.5 10.5L12 15l4.5-4.5M4.5 15v3.5a1.5 1.5 0 001.5 1.5h12a1.5 1.5 0 001.5-1.5V15"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="18" cy="12" r="1.2"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5"/></symbol>
    <symbol id="i-power" viewBox="0 0 24 24"><path d="M12 4v7.5"/><path d="M7.2 7.2a7 7 0 109.6 0"/></symbol>
    <symbol id="i-keyboard" viewBox="0 0 24 24"><rect x="3" y="6.5" width="18" height="11" rx="2"/><path d="M7 10h.01M10.3 10h.01M13.6 10h.01M17 10h.01M7.5 14h9"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M13.5 4.5h6v6M19.5 4.5L11 13M17 14v4.5a1 1 0 01-1 1H5.5a1 1 0 01-1-1V8a1 1 0 011-1H10"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4l9 15.5H3z"/><path d="M12 10v4M12 16.8h.01"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M5 6.5l6 5.5-6 5.5M12.5 18h6.5"/></symbol>
    <symbol id="i-tag" viewBox="0 0 24 24"><path d="M4 4.5h7.5l8.5 8.5-7 7-8.5-8.5z"/><circle cx="8.5" cy="9" r="1.3"/></symbol>
    <symbol id="i-palette" viewBox="0 0 24 24"><path d="M12 3.5a8.5 8.5 0 100 17c1.2 0 1.8-.8 1.8-1.7 0-1.3-1-1.5-1-2.6 0-.9.7-1.6 1.7-1.6h2.2a3.8 3.8 0 003.8-3.8c0-4.2-3.8-7.3-8.5-7.3z"/><circle cx="8" cy="11" r="1"/><circle cx="11" cy="7.5" r="1"/><circle cx="15.5" cy="8.5" r="1"/></symbol>
  </defs>
</svg>

<div class="app" id="app">
  <aside class="rail">
    <div class="brand">
      <svg class="brand-mark"><use href="#i-port"/></svg>
      <div class="brand-name"><strong>Putty Launcher</strong><span id="brand-version">Chirag</span></div>
    </div>

    <nav class="nav" aria-label="Views">
      <button class="nav-item" data-action="go" data-view="devices" data-scope="all"><svg><use href="#i-list"/></svg><span>All devices</span><em id="count-all"></em></button>
      <button class="nav-item" data-action="go" data-view="devices" data-scope="favorites"><svg><use href="#i-star"/></svg><span>Favorites</span><em id="count-favorites"></em></button>
      <button class="nav-item" data-action="go" data-view="devices" data-scope="recent"><svg><use href="#i-clock"/></svg><span>Recently opened</span><em id="count-recent"></em></button>

      <div class="nav-heading">
        <span>Groups</span>
        <button class="icon-button small" data-action="new-group" title="New group"><svg><use href="#i-plus"/></svg></button>
      </div>
      <div id="group-list" class="group-list"></div>

      <div class="nav-heading"><span>Workspace</span></div>
      <button class="nav-item" data-action="go" data-view="logs"><svg><use href="#i-log"/></svg><span>Session logs</span></button>
      <button class="nav-item" data-action="go" data-view="netbox"><svg><use href="#i-netbox"/></svg><span>NetBox</span><i id="netbox-flag" class="flag" hidden></i></button>
      <button class="nav-item" data-action="go" data-view="settings"><svg><use href="#i-sliders"/></svg><span>Settings</span></button>
    </nav>

    <div class="rail-foot">
      <label class="profile-switch" title="Connection profile used for new sessions (Ctrl+Shift+P)">
        <span class="profile-label">Signing in as</span>
        <select id="profile-select" aria-label="Connection profile"></select>
        <svg class="select-chevron"><use href="#i-chevron"/></svg>
      </label>
      <div class="putty-status">
        <span id="putty-count">No PuTTY windows open</span>
        <button class="text-button danger" id="close-all" data-action="close-all-putty" hidden>Close all</button>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="omnibar" id="omnibar">
        <svg class="omni-icon"><use href="#i-search"/></svg>
        <input id="omni" type="text" autocomplete="off" spellcheck="false" placeholder="Find a device, or type an IP address to connect">
        <kbd class="omni-hint">Ctrl K</kbd>
      </div>
      <div class="topbar-actions">
        <button class="button" id="sync-button" data-action="sync-netbox" title="Sync from NetBox (F5)">
          <svg><use href="#i-sync"/></svg><span>Sync NetBox</span>
        </button>
        <button class="icon-button" id="activity-button" data-action="toggle-activity" title="Notifications">
          <svg><use href="#i-bell"/></svg><i class="badge" id="activity-badge" hidden></i>
        </button>
        <button class="icon-button" data-action="shortcuts" title="Keyboard shortcuts (?)"><svg><use href="#i-keyboard"/></svg></button>
      </div>
    </header>

    <section class="view" id="view-devices"></section>
    <section class="view" id="view-logs" hidden></section>
    <section class="view" id="view-netbox" hidden></section>
    <section class="view" id="view-settings" hidden></section>
  </main>

  <aside class="inspector" id="inspector" aria-label="Device details"></aside>
</div>

<div id="activity-panel" class="popover activity" hidden></div>
<div id="menu" class="menu" hidden></div>
<div id="modal-root"></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<div id="boot" class="boot"><svg class="brand-mark"><use href="#i-port"/></svg><span>Loading your devices</span></div>

<script src="app.js"></script>
</body>
</html>
